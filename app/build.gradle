plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services' // Apply Google Services plugin for Firebase
}

android {
    compileSdk 36
    namespace = "com.sameetasadullah.i180479_180531"

    defaultConfig {
        applicationId "com.sameetasadullah.i180479_180531"
        minSdk 26
        //noinspection OldTargetApi
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    
    // Firebase BOM - controls versions of all Firebase libraries
    implementation platform('com.google.firebase:firebase-bom:33.6.0')
    
    // Firebase Authentication
    implementation 'com.google.firebase:firebase-auth'
    
    // WebSocket client for real-time chat
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
    
    // JSON handling for WebSocket messages
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Firebase Realtime Database for user search and contacts
    implementation 'com.google.firebase:firebase-database'
    // implementation 'com.google.firebase:firebase-firestore'
    
    testImplementation 'junit:junit:4.13.2'
    //noinspection GradleDependency
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'
}
