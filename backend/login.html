<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messaging - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .logo p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        
        .success {
            background: #efe;
            color: #3c3;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 10px;
            color: #667eea;
        }
        
        .user-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .rank-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }
        
        .rank-commander { background: #dc3545; }
        .rank-captain { background: #fd7e14; }
        .rank-troops { background: #28a745; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🛡️ Secure Messaging</h1>
            <p>Enter your credentials to access the system</p>
        </div>
        
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>
        <div class="loading" id="loadingMsg">🔄 Authenticating...</div>
        
        <div class="user-info" id="userInfo">
            <h3>Welcome back!</h3>
            <p><strong>Username:</strong> <span id="userName"></span></p>
            <p><strong>Rank:</strong> <span id="userRank"></span></p>
            <p><strong>Bio:</strong> <span id="userBio"></span></p>
            <button class="login-btn" onclick="proceedToDashboard()">Continue to Dashboard</button>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">
                🔐 Login
            </button>
        </form>
        
        <div class="register-link">
            <p>Don't have an account? <a href="register.html">Register here</a></p>
            <p><a href="test-page.html">Test API Functions</a></p>
        </div>
    </div>

    <script>
        const API_BASE = `http://${window.location.hostname}:3000`;
        
        // Check if user is already logged in
        window.onload = function() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                showUserInfo(user);
            }
        };
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            await loginUser();
        });
        
        async function loginUser() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }
            
            showLoading(true);
            hideError();
            hideSuccess();
            
            try {
                // Since we don't have a login endpoint, we'll verify by attempting to get user info
                // First, we need to find the user by username (this is a workaround)
                const loginResult = await attemptLogin(username, password);
                
                if (loginResult.success) {
                    showSuccess('Login successful! Welcome back.');
                    localStorage.setItem('currentUser', JSON.stringify(loginResult.user));
                    setTimeout(() => {
                        showUserInfo(loginResult.user);
                    }, 1500);
                } else {
                    showError(loginResult.message || 'Invalid username or password');
                }
                
            } catch (error) {
                showError('Login failed: ' + error.message);
            } finally {
                showLoading(false);
            }
        }
        
        async function attemptLogin(username, password) {
            // This is a simplified login verification
            // In a real system, you'd have a proper authentication endpoint
            
            try {
                // Try to find user by checking recent registrations or test known users
                const knownUsers = [
                    { id: 1, username: 'trooper_007', rank_level: 1 },
                    { id: 8, username: 'arin', rank_level: 2 },
                    { id: 9, username: 'deepak', rank_level: 3 },
                    { id: 10, username: 'john', rank_level: 1 },
                    { id: 11, username: 'sara', rank_level: 2 },
                    { id: 12, username: 'mike', rank_level: 3 }
                ];
                
                const foundUser = knownUsers.find(u => u.username === username);
                
                if (foundUser && password === 'password123') {
                    // Get full user details
                    const userResponse = await fetch(`${API_BASE}/api/users/${foundUser.id}`);
                    if (userResponse.ok) {
                        const userData = await userResponse.json();
                        return {
                            success: true,
                            user: userData
                        };
                    }
                }
                
                return {
                    success: false,
                    message: 'Invalid credentials. Try password: password123'
                };
                
            } catch (error) {
                return {
                    success: false,
                    message: 'Authentication service unavailable'
                };
            }
        }
        
        function showUserInfo(user) {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('userInfo').style.display = 'block';
            
            document.getElementById('userName').textContent = user.username;
            
            const rankBadge = `<span class="rank-badge rank-${user.rank_name.toLowerCase()}">${user.rank_name}</span>`;
            document.getElementById('userRank').innerHTML = rankBadge;
            
            document.getElementById('userBio').textContent = user.bio || 'No bio provided';
        }
        
        function proceedToDashboard() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            // Redirect to dashboard with user info
            window.location.href = `dashboard.html?user=${encodeURIComponent(JSON.stringify(user))}`;
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('errorMsg').style.display = 'none';
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMsg');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
        
        function hideSuccess() {
            document.getElementById('successMsg').style.display = 'none';
        }
        
        function showLoading(show) {
            document.getElementById('loadingMsg').style.display = show ? 'block' : 'none';
            document.getElementById('loginBtn').disabled = show;
        }
    </script>
</body>
</html>
